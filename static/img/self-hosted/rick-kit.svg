<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Resgrid Incident Command Kit network: phones and a laptop on the hotspot WiFi connect to rick1, which forwards to rick2, rick3 and rick4 over the kit switch">
  <rect width="960" height="620" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker>
  </defs>

  <!-- clients -->
  <g>
    <rect x="40" y="24" width="250" height="78" rx="10" fill="#ebf4ff" stroke="#2b6cb0"/>
    <text x="165" y="54" text-anchor="middle" font-size="16" font-weight="600" fill="#1a365d">Responders' phones</text>
    <text x="165" y="78" text-anchor="middle" font-size="13" fill="#2d3748">Resgrid Responder + Unit apps</text>
    <rect x="670" y="24" width="250" height="78" rx="10" fill="#ebf4ff" stroke="#2b6cb0"/>
    <text x="795" y="54" text-anchor="middle" font-size="16" font-weight="600" fill="#1a365d">Command laptop</text>
    <text x="795" y="78" text-anchor="middle" font-size="13" fill="#2d3748">Resgrid web app in a browser</text>
  </g>
  <text x="330" y="70" font-size="13" fill="#4a5568">WiFi (WPA2/3)</text>
  <text x="560" y="70" font-size="13" fill="#4a5568">WiFi or cable</text>
  <line x1="290" y1="63" x2="390" y2="138" stroke="#4a5568" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/>
  <line x1="670" y1="63" x2="570" y2="138" stroke="#4a5568" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/>

  <!-- router -->
  <rect x="330" y="140" width="300" height="70" rx="10" fill="#fefcbf" stroke="#b7791f"/>
  <text x="480" y="168" text-anchor="middle" font-size="16" font-weight="600" fill="#744210">Hotspot router 192.168.50.1</text>
  <text x="480" y="192" text-anchor="middle" font-size="13" fill="#2d3748">DHCP · DNS: rg / rgapi / rgevents → rick1 · no internet</text>
  <line x1="480" y1="210" x2="480" y2="244" stroke="#4a5568" stroke-width="2"/>

  <!-- switch -->
  <rect x="200" y="244" width="560" height="40" rx="8" fill="#edf2f7" stroke="#718096"/>
  <text x="480" y="270" text-anchor="middle" font-size="14" font-weight="600" fill="#2d3748">Gigabit switch (PoE+ optional)</text>
  <g stroke="#4a5568" stroke-width="2">
    <line x1="140" y1="284" x2="140" y2="318"/><line x1="370" y1="284" x2="370" y2="318"/>
    <line x1="600" y1="284" x2="600" y2="318"/><line x1="830" y1="284" x2="830" y2="318"/>
    <line x1="140" y1="284" x2="830" y2="284"/>
  </g>

  <!-- nodes -->
  <g font-size="13" fill="#2d3748">
    <rect x="40" y="318" width="200" height="200" rx="10" fill="#f0fff4" stroke="#2f855a" stroke-width="2"/>
    <text x="140" y="344" text-anchor="middle" font-size="16" font-weight="700" fill="#22543d">rick1 · edge</text>
    <text x="140" y="364" text-anchor="middle" fill="#4a5568">192.168.50.11</text>
    <text x="60" y="394">Caddy  :443 (HTTPS)</text>
    <text x="60" y="416">Web app</text>
    <text x="60" y="438">Events hub (SignalR)</text>
    <text x="60" y="460">Kit DNS (optional)</text>
    <text x="60" y="482">Time source (chrony)</text>

    <rect x="270" y="318" width="200" height="200" rx="10" fill="#faf5ff" stroke="#6b46c1" stroke-width="2"/>
    <text x="370" y="344" text-anchor="middle" font-size="16" font-weight="700" fill="#44337a">rick2 · app</text>
    <text x="370" y="364" text-anchor="middle" fill="#4a5568">192.168.50.12</text>
    <text x="290" y="394">API :5152</text>
    <text x="290" y="416">Worker (migrations, jobs)</text>
    <text x="290" y="438">Text-to-speech :5154</text>
    <text x="290" y="460">MCP (local only)</text>
    <text x="290" y="482">Trackers / relay (opt.)</text>

    <rect x="500" y="318" width="200" height="200" rx="10" fill="#fff5f5" stroke="#c53030" stroke-width="2"/>
    <text x="600" y="344" text-anchor="middle" font-size="16" font-weight="700" fill="#742a2a">rick3 · data</text>
    <text x="600" y="364" text-anchor="middle" fill="#4a5568">192.168.50.13</text>
    <text x="520" y="394">PostgreSQL :5432</text>
    <text x="520" y="416">resgrid, resgridoidc,</text>
    <text x="520" y="438">resgridworkers, resgriddoc</text>
    <text x="520" y="460">Backups (./rick.sh backup)</text>

    <rect x="730" y="318" width="200" height="200" rx="10" fill="#fffaf0" stroke="#c05621" stroke-width="2"/>
    <text x="830" y="344" text-anchor="middle" font-size="16" font-weight="700" fill="#7b341e">rick4 · infra</text>
    <text x="830" y="364" text-anchor="middle" fill="#4a5568">192.168.50.14</text>
    <text x="750" y="394">Redis :6379</text>
    <text x="750" y="416">RabbitMQ :5672</text>
    <text x="750" y="438">RustFS (S3) :9000</text>
    <text x="750" y="460">Map tiles :5156</text>
  </g>

  <!-- flows -->
  <text x="40" y="552" font-size="13" fill="#2d3748"><tspan font-weight="600">Clients</tspan> only talk to rick1 on 443. rick1 forwards /api and /tts to rick2 and /tiles to rick4.</text>
  <text x="40" y="574" font-size="13" fill="#2d3748"><tspan font-weight="600">rick1 + rick2</tspan> use PostgreSQL on rick3 and Redis, RabbitMQ and RustFS on rick4.</text>
  <text x="40" y="596" font-size="13" fill="#2d3748"><tspan font-weight="600">Power-on:</tspan> every container starts by itself and waits for the other nodes; boot order doesn't matter.</text>
</svg>
