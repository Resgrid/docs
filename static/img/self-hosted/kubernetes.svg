<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Resgrid on Kubernetes: an Ingress routes to web, api and events Deployments, which use PostgreSQL, Redis, RabbitMQ and RustFS StatefulSets with persistent volumes">
  <rect width="960" height="500" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker>
  </defs>
  <rect x="300" y="18" width="360" height="50" rx="10" fill="#ebf4ff" stroke="#2b6cb0"/>
  <text x="480" y="48" text-anchor="middle" font-size="15" font-weight="600" fill="#1a365d">Clients → DNS → load balancer / node IPs :443</text>
  <line x1="480" y1="68" x2="480" y2="96" stroke="#4a5568" stroke-width="2" marker-end="url(#a)"/>
  <rect x="30" y="98" width="900" height="380" rx="14" fill="#f7fafc" stroke="#a0aec0" stroke-dasharray="6 5"/>
  <text x="50" y="122" font-size="13" fill="#4a5568">Kubernetes / k3s cluster · namespace resgrid · spread over several nodes</text>
  <rect x="330" y="132" width="300" height="52" rx="10" fill="#f0fff4" stroke="#2f855a" stroke-width="2"/>
  <text x="480" y="155" text-anchor="middle" font-size="15" font-weight="700" fill="#22543d">Ingress (Traefik / nginx)</text>
  <text x="480" y="174" text-anchor="middle" font-size="12" fill="#2d3748">TLS secret resgrid-ingress-tls</text>
  <g stroke="#4a5568" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M390 184 L175 222"/><path d="M460 184 L400 222"/><path d="M520 184 L610 222"/><path d="M570 184 L800 222"/>
  </g>
  <g font-size="13" fill="#2d3748">
    <rect x="80" y="224" width="190" height="62" rx="8" fill="#ffffff" stroke="#2b6cb0"/>
    <text x="175" y="248" text-anchor="middle" font-weight="600">web × N</text><text x="175" y="268" text-anchor="middle">Deployment</text>
    <rect x="305" y="224" width="190" height="62" rx="8" fill="#ffffff" stroke="#2b6cb0"/>
    <text x="400" y="248" text-anchor="middle" font-weight="600">api × N</text><text x="400" y="268" text-anchor="middle">Deployment</text>
    <rect x="515" y="224" width="190" height="62" rx="8" fill="#ffffff" stroke="#2b6cb0"/>
    <text x="610" y="248" text-anchor="middle" font-weight="600">events × 1</text><text x="610" y="268" text-anchor="middle">SignalR (Redis backplane)</text>
    <rect x="725" y="224" width="170" height="62" rx="8" fill="#ffffff" stroke="#2b6cb0"/>
    <text x="810" y="248" text-anchor="middle" font-weight="600">tts</text><text x="810" y="268" text-anchor="middle">/tts/audio</text>
    <rect x="180" y="300" width="270" height="50" rx="8" fill="#faf5ff" stroke="#6b46c1"/>
    <text x="315" y="322" text-anchor="middle" font-weight="600">worker × 1</text><text x="315" y="340" text-anchor="middle">init: create databases · migrations · jobs</text>
    <rect x="510" y="300" width="270" height="50" rx="8" fill="#faf5ff" stroke="#6b46c1"/>
    <text x="645" y="322" text-anchor="middle" font-weight="600">mcp</text><text x="645" y="340" text-anchor="middle">cluster-internal only</text>
  </g>
  <line x1="480" y1="354" x2="480" y2="376" stroke="#4a5568" stroke-width="2" marker-end="url(#a)"/>
  <g font-size="13" fill="#2d3748">
    <rect x="70" y="380" width="190" height="78" rx="8" fill="#fff5f5" stroke="#c53030"/>
    <text x="165" y="404" text-anchor="middle" font-weight="600">db (PostgreSQL)</text><text x="165" y="424" text-anchor="middle">StatefulSet + PVC</text><text x="165" y="444" text-anchor="middle" font-size="11">or CloudNativePG / managed</text>
    <rect x="280" y="380" width="190" height="78" rx="8" fill="#fffaf0" stroke="#c05621"/>
    <text x="375" y="404" text-anchor="middle" font-weight="600">redis</text><text x="375" y="424" text-anchor="middle">StatefulSet + PVC</text>
    <rect x="490" y="380" width="190" height="78" rx="8" fill="#fffaf0" stroke="#c05621"/>
    <text x="585" y="404" text-anchor="middle" font-weight="600">rabbitmq</text><text x="585" y="424" text-anchor="middle">StatefulSet + PVC</text><text x="585" y="444" text-anchor="middle" font-size="11">or Cluster Operator ×3</text>
    <rect x="700" y="380" width="190" height="78" rx="8" fill="#fffaf0" stroke="#c05621"/>
    <text x="795" y="404" text-anchor="middle" font-weight="600">rustfs (S3)</text><text x="795" y="424" text-anchor="middle">StatefulSet + PVC</text>
  </g>
</svg>
